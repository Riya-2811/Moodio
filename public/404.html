<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redirecting...</title>
  <script>
    // Preserve the path and query string when redirecting
    var path = window.location.pathname;
    var search = window.location.search;
    var hash = window.location.hash;
    
    // Redirect to index.html with the original path
    // React Router will then handle the routing
    window.location.replace('/index.html' + path + search + hash);
  </script>
  <meta http-equiv="refresh" content="0; url=/index.html">
</head>
<body>
  <p>Redirecting... If you are not redirected, <a href="/index.html">click here</a>.</p>
</body>
</html>
